[project]
name = "thatline"
version = "0.1.0"
description = "Finally, a way to find that line from that series you wanted to quote, but forgot."
authors = "Roman Vlasenko <klavionik@gmail.com>"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "cyclopts>=4.22.2",
    "openai-whisper>=20250625",
    "pydantic>=2.13.4",
    "typed-ffmpeg>=4.3",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ty>=0.0.64",
]
